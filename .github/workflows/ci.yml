name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Rust checks
        run: |
          rustc --version
          cargo fmt --check
          cargo test
          cargo clippy --all-targets --all-features -- -D warnings

  benchmarks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install benchmark dependencies
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          brew install llvm cmake apache-arrow
          python3 -m venv .venv
          .venv/bin/pip install -r benchmarks/requirements.txt
      - name: C++26 checks
        run: |
          cmake --fresh -S benchmarks/cpp -B benchmarks/cpp/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=/opt/homebrew/opt/llvm/bin/clang++ \
            -DCMAKE_PREFIX_PATH=/opt/homebrew/opt/apache-arrow \
            -DDREMEL_CXX_STANDARD=26
          cmake --build benchmarks/cpp/build -j
          ctest --test-dir benchmarks/cpp/build --output-on-failure
      - name: Cross-engine smoke benchmark
        env:
          DATASET_ROWS: 20000
          WARMUP: 0
          ITERATIONS: 1
        run: ./benchmark.sh
